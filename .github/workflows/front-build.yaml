name: Test deploy_6 # Workflow 이름
on: # Event 감지
  push:
    branches:
      - main
      - develop

jobs: # Job 설정
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code. # Repo checkout
        uses: actions/checkout@v2

      - name: Install Node.js # Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: 'npm'

      - name: Check Node v # Node.js 버전 확인
        run: node -v

      - name: Install Dependencies # 의존 파일 설치
        run: npm install

      - name: .env setting for main branch # main 브랜치 환경변수 설정
        if: github.ref == 'refs/heads/main'
        run: |
          echo "REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL_DEPLOY }}" >> .env

      - name: .env setting for develop branch # develop 브랜치 환경변수 설정
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}" >> .env

      - name: Build # React Build
        run: npm run build

      - name: Copy file to server via SSH key for main branch # main 브랜치 서버로 파일 복사
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST_DEPLOY }}
          username: ${{ secrets.AWS_USERNAME_DEPLOY }}
          key: ${{ secrets.AWS_SSH_KEY_DEPLOY }}
          source: 'build/*'
          target: '/home/ubuntu/frontserver'

      - name: Copy file to server via SSH key for develop branch # develop 브랜치 서버로 파일 복사
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: 'build/*'
          target: '/home/ubuntu/frontserver'