name: Test deploy_6 # Workflow 이름
on: # Event 감지
  push:
    branches:
      - main
jobs: # Job 설정
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code. # Repo checkout
        uses: actions/checkout@v2

      - name: install node js # Repo checkout
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: 'npm'

      - name: Check Node v # Node v 확인
        run: node -v

      - name: Install Dependencies # 의존 파일 설치
        run:
          npm install

          # .env에 있던 환경변수들을 등록해주는 단계
      - name: .env setting
        run: |
          echo "REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL_DEPLOY }}" >> .env

      - name: Build # React Build
        run: npm run build

      - name: copy file to server via ssh key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST_DEPLOY }}
          username: ${{ secrets.AWS_USERNAME_DEPLOY }}
          key: ${{ secrets.AWS_SSH_KEY_DEPLOY }}
          source: 'build/*'
          target: '/home/ubuntu/frontserver'
